<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes System Design</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your simple online notes manager</p>
    </header>

    <main>
        <section aria-labelledby="notes-heading">
            <h2 id="notes-heading">Your notes</h2>

            <button id="load-btn" type="button">Load notes</button>

            <p id="status" role="status" aria-live="polite">
                Click "Load notes" to fetch notes from the server.
            </p>

            <ul id="notes-list"></ul>
        </section>

        <section aria-labelledby="create-heading">
            <h2 id="create-heading">Create a note</h2>

            <form id="note-form">
                <div>
                    <label for="title-input">Title (required, maximum 100 characters)</label>
                    <input
                        type="text"
                        id="title-input"
                        name="title"
                        maxlength="100"
                        required
                    >
                </div>

                <div>
                    <label for="body-input">Note body (optional)</label>
                    <textarea
                        id="body-input"
                        name="body"
                        rows="4"
                    ></textarea>
                </div>

                <button id="submit-btn" type="submit">Create note</button>
            </form>
        </section>
    </main>
</body>
</html>
